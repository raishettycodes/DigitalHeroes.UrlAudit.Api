# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - digitalheroes-url-audit-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app




      - name: Login to Azure
        uses: azure/login@v2
        with:
        client-id: ${{ secrets.AZURE_CLIENT_ID2253a08c-772a-48e9-a05b-5525da38bad0 }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID1d810d0b-723e-44dd-9bfc-2313b17eba36 }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID207da4f0-6552-4fc9-8041-700ca1c39804 }}
     

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'digitalheroes-url-audit-api'
          slot-name: 'Production'
          package: .
          